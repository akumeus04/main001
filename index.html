<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Apps Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#272727">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apps Hub">
    <link rel="apple-touch-icon" href="logo-192.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(() => console.log('Hub Service Worker registered'))
            .catch(err => console.error('Hub Service Worker failed', err));
        });
      }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand-red: #DA291C;
            --brand-dark: #272727;
            --bg-color: #f6f6f7;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --border-light: #e3e3e3;
            --input-bg: #fafafa;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
        }
        button { font: inherit; }

        /* ══ LOGIN SCREEN ══ */
        .login-overlay {
            position: fixed; inset: 0;
            background: rgba(39, 39, 39, 0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 24px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 40px 32px;
            width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            animation: loginPop 0.5s var(--ease);
        }
        @keyframes loginPop {
            from { opacity: 0; transform: scale(0.92) translateY(16px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .login-logo {
            width: 64px; height: 64px; border-radius: 16px;
            background: var(--brand-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 20px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(218, 41, 28, 0.25);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .login-card h2 { font-weight: 700; font-size: 1.5rem; margin-bottom: 6px; }
        .login-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 28px; }
        .login-error {
            display: none; background: #FEF2F2; color: var(--brand-red);
            padding: 12px 14px; border-radius: 12px;
            margin-bottom: 20px; font-size: 0.85rem; font-weight: 600;
            border-left: 3px solid var(--brand-red); text-align: left;
        }
        .btn-login {
            width: 100%; padding: 14px; margin-top: 4px;
            background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s ease;
        }
        .btn-login:hover:not(:disabled) {
            background: #ffffff;
            border-color: var(--brand-red);
            box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.12);
            transform: translateY(-1px);
        }
        .btn-login:active:not(:disabled) { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }

        /* ══ MAIN HUB ══ */
        .app-shell { display: none; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
        .app-shell.visible { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Header */
        .hub-header {
            background: var(--brand-dark);
            padding: calc(36px + env(safe-area-inset-top)) 20px 64px;
            position: relative; overflow: hidden;
            border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: -34px;
        }
        .hub-header::before, .hub-header::after {
            content: ""; position: absolute; border-radius: 50%;
            background: var(--brand-red); opacity: 0.12; pointer-events: none;
        }
        .hub-header::before { width: 220px; height: 220px; top: -90px; right: -60px; }
        .hub-header::after  { width: 140px; height: 140px; bottom: -70px; left: -40px; opacity: 0.08; }

        .header-inner {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            position: relative; z-index: 1; max-width: 1000px; margin: 0 auto;
        }
        .header-title { font-size: 1.4rem; font-weight: 700; color: #ffffff; }
        .header-sub { font-size: 0.85rem; color: #aaaaaa; margin-top: 2px; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .btn-icon, .btn-install {
            height: 44px; border-radius: 14px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; color: #ffffff;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .btn-icon { width: 44px; font-size: 1.2rem; }
        .btn-install { padding: 0 16px; font-size: 0.85rem; font-weight: 600; display: none; }
        .btn-install.show { display: flex; animation: popIn 0.5s var(--ease); }
        .btn-install { background: var(--brand-red); border-color: var(--brand-red); }
        .btn-install:hover { background: #c4241a; transform: translateY(-2px); }
        .btn-icon:hover { background: rgba(218, 41, 28, 0.15); border-color: var(--brand-red); transform: translateY(-2px); }
        .btn-icon:active, .btn-install:active { transform: scale(0.95); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        /* Grid */
        .hub-container {
            max-width: 1000px; margin: 0 auto; padding: 0 16px;
            position: relative; z-index: 2;
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        /* App Cards */
        .app-card {
            position: relative; overflow: hidden;
            background: var(--card-bg); border-radius: 18px;
            padding: 22px 12px 18px;
            text-align: center; text-decoration: none; color: var(--text-main);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; min-height: 150px;
            border: 1px solid var(--border-light);
            transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.25s;
            opacity: 0;
            animation: cardIn 0.6s var(--ease) forwards;
            animation-delay: calc(var(--i, 0) * 70ms);
            outline: none;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(22px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* red accent bar that slides in on hover */
        .app-card::before {
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
            background: var(--brand-red);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.4s var(--ease);
        }
        /* soft red glow */
        .app-card::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 0%, rgba(218, 41, 28, 0.08), transparent 65%);
            opacity: 0; transition: opacity 0.35s;
        }
        .app-icon-wrap {
            position: relative; z-index: 1;
            width: 64px; height: 64px; border-radius: 16px;
            background: var(--input-bg); border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; overflow: hidden;
            transition: transform 0.4s var(--ease), border-color 0.25s, box-shadow 0.3s;
        }
        .app-icon-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .app-name {
            position: relative; z-index: 1;
            font-size: 0.85rem; font-weight: 600; line-height: 1.3;
            transition: color 0.25s;
        }
        .app-open {
            position: absolute; z-index: 1; top: 12px; right: 14px;
            font-size: 0.95rem; color: var(--brand-red); font-weight: 700;
            opacity: 0; transform: translate(-6px, 6px);
            transition: opacity 0.3s, transform 0.35s var(--ease);
        }

        @media (hover: hover) {
            .app-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 14px 32px rgba(218, 41, 28, 0.14);
                border-color: var(--brand-red);
            }
            .app-card:hover::before { transform: scaleX(1); }
            .app-card:hover::after  { opacity: 1; }
            .app-card:hover .app-icon-wrap {
                transform: scale(1.12) rotate(-4deg);
                border-color: var(--brand-red);
                box-shadow: 0 6px 16px rgba(218, 41, 28, 0.25);
            }
            .app-card:hover .app-name { color: var(--brand-red); }
            .app-card:hover .app-open { opacity: 1; transform: translate(0, 0); }
        }
        .app-card:focus-visible {
            border-color: var(--brand-red);
            box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.25);
        }
        .app-card:active { transform: scale(0.96); transition-duration: 0.12s; }

        /* Install banner (shown on Android after a moment) */
        .install-banner {
            position: fixed; left: 12px; right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            max-width: 460px; margin: 0 auto;
            background: var(--brand-dark); color: #fff;
            border-radius: 16px; padding: 14px 14px 14px 16px;
            display: none; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 500;
        }
        .install-banner.show { display: flex; animation: slideUp 0.5s var(--ease); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .install-banner img { width: 40px; height: 40px; border-radius: 10px; }
        .install-banner .txt { flex: 1; min-width: 0; }
        .install-banner .txt strong { display: block; font-size: 0.88rem; }
        .install-banner .txt span { font-size: 0.75rem; color: #aaa; }
        .install-banner button {
            border: 0; cursor: pointer; border-radius: 10px;
            padding: 9px 14px; font-size: 0.8rem; font-weight: 600;
        }
        .install-banner .go { background: var(--brand-red); color: #fff; }
        .install-banner .later { background: transparent; color: #aaa; padding: 9px 6px; }

        /* Larger screens */
        @media (min-width: 600px) {
            .hub-header { padding: calc(52px + env(safe-area-inset-top)) 32px 72px; margin-bottom: -38px; }
            .header-title { font-size: 1.7rem; }
            .header-sub { font-size: 0.95rem; }
            .hub-container { padding: 0 28px; }
            .apps-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; }
            .app-card { padding: 32px 18px 26px; min-height: 190px; gap: 18px; }
            .app-icon-wrap { width: 76px; height: 76px; font-size: 38px; border-radius: 18px; }
            .app-name { font-size: 0.98rem; }
        }
        @media (min-width: 1024px) {
            .apps-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 360px) {
            .btn-install span { display: none; }
            .btn-install { padding: 0 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
            .app-card { opacity: 1; }
        }
    </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <div class="login-logo">🚀</div>
        <h2>Apps Hub</h2>
        <p>Sign in to access your tools</p>
        <div id="loginError" class="login-error"></div>
        <button type="button" id="googleLoginBtn" class="btn-login" onclick="window.handleGoogleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" style="width: 20px; height: 20px;">
            Sign in with Google
        </button>
    </div>
</div>

<!-- ══ MAIN HUB ══ -->
<div class="app-shell" id="appShell">
    <div class="hub-header">
        <div class="header-inner">
            <div>
                <div class="header-title">Welcome Back 👋</div>
                <div class="header-sub">Select an app to continue</div>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-install" id="installBtn" title="Install app">⬇️ <span>Install</span></button>
                <button type="button" class="btn-icon" onclick="window.logout()" title="Sign Out" aria-label="Sign out">🚪</button>
            </div>
        </div>
    </div>

    <div class="hub-container">
        <div class="apps-grid" id="appsGrid"></div>
    </div>
</div>

<!-- Install banner -->
<div class="install-banner" id="installBanner">
    <img src="logo-192.png" alt="">
    <div class="txt">
        <strong>Install Apps Hub</strong>
        <span>Add to your home screen for quick access</span>
    </div>
    <button type="button" class="later" id="installLater">Later</button>
    <button type="button" class="go" id="installGo">Install</button>
</div>

<!-- ══ PWA INSTALL LOGIC ══ -->
<script>
(function () {
    let deferredPrompt = null;
    const btn    = document.getElementById('installBtn');
    const banner = document.getElementById('installBanner');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    function hideAll() { btn.classList.remove('show'); banner.classList.remove('show'); }

    async function doInstall() {
        if (!deferredPrompt) return;
        banner.classList.remove('show');
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (e) {}
        deferredPrompt = null;
        btn.classList.remove('show');
    }

    // Chrome on Android fires this when the app is installable
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        if (isStandalone) return;
        deferredPrompt = e;
        btn.classList.add('show');
        let dismissed = false;
        try { dismissed = sessionStorage.getItem('installDismissed') === '1'; } catch (err) {}
        if (!dismissed) setTimeout(() => { if (deferredPrompt) banner.classList.add('show'); }, 2500);
    });

    window.addEventListener('appinstalled', () => { deferredPrompt = null; hideAll(); });

    btn.addEventListener('click', doInstall);
    document.getElementById('installGo').addEventListener('click', doInstall);
    document.getElementById('installLater').addEventListener('click', () => {
        banner.classList.remove('show');
        try { sessionStorage.setItem('installDismissed', '1'); } catch (err) {}
    });
})();
</script>

<!-- ══ FIREBASE LOGIC ══ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAc46X6MIXI-moZ2oTy2ShiDv6IrjhVQC4",
    authDomain: "finance-app-23309.firebaseapp.com",
    projectId: "finance-app-23309",
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ==========================================
// CENTRALIZED APPS LIST
// ==========================================
const APPS = [
    { name: "Pitaka Wallet Desktop", url: "https://akumeus04.github.io/pitaka-wallet/#dashboard",   emoji: "👛" },
	{ name: "Pitaka Wallet Mobile",  url: "https://akumeus04.github.io/pitaka-wallet/mobile.html#dashboard",   emoji: "👛" },
    { name: "Reminder",         url: "https://akumeus04.github.io/Tools/Reminder",             emoji: "🚨" },
    { name: "Car Loan Tracker", url: "https://akumeus04.github.io/pitaka-wallet/car/car_loan", emoji: "🚘" },
    { name: "Happy Home Bills", url: "https://akumeus04.github.io/HappyHomeBills/",            emoji: "🏠" },
    { name: "TimeIn - TimeOut", url: "https://akumeus04.github.io/Tools/TimeIn-TimeOut",       emoji: "⏱️" },
    { name: "ToPDF & Merge",    url: "https://akumeus04.github.io/Tools/ToPDFnMerge",          emoji: "📄" }
];

function renderGrid() {
    const grid = document.getElementById('appsGrid');
    grid.innerHTML = '';
    APPS.forEach((a, i) => {
        const card = document.createElement('a');
        card.href = a.url;
        card.className = 'app-card';
        card.style.setProperty('--i', i);

        const wrap = document.createElement('div');
        wrap.className = 'app-icon-wrap';

        // Check if a specific image icon is set; otherwise, use the emoji
        if (a.icon) {
            const img = document.createElement('img');
            img.className = 'app-icon-img';
            img.src = a.icon;
            img.alt = '';
            img.addEventListener('error', () => { wrap.textContent = a.emoji; });
            wrap.appendChild(img);
        } else {
            wrap.textContent = a.emoji;
        }

        const name = document.createElement('div');
        name.className = 'app-name';
        name.textContent = a.name;

        const arrow = document.createElement('span');
        arrow.className = 'app-open';
        arrow.textContent = '↗';
        arrow.setAttribute('aria-hidden', 'true');

        card.append(arrow, wrap, name);
        grid.appendChild(card);
    });
}

// ==========================================
// SECURITY & AUTH SETUP (SHA-256 RESTRICTED)
// ==========================================
// 🚨 Paste your 64-character SHA-256 email hash below (in lowercase)
const ALLOWED_EMAIL_HASH = "24a8875545b9c0867169cc58a471fd522134a0c8ac795110f4111a9fbdae7d14";

async function hashEmail(email) {
    if (!email) return "";
    const msgBuffer = new TextEncoder().encode(email.toLowerCase().trim());
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const GOOGLE_BTN_HTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" style="width: 20px; height: 20px;"> Sign in with Google`;

onAuthStateChanged(auth, async (user) => {
    const btn = document.getElementById('googleLoginBtn');
    if (user) {
        const userHash = await hashEmail(user.email || "");

        if (userHash !== ALLOWED_EMAIL_HASH) {
            await signOut(auth);
            const errDiv = document.getElementById('loginError');
            errDiv.textContent = "Access Denied: Account not authorized.";
            errDiv.style.display = 'block';
            btn.innerHTML = GOOGLE_BTN_HTML;
            btn.disabled = false;
            return;
        }

        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appShell').classList.add('visible');
        document.getElementById('loginError').style.display = 'none';
        renderGrid();
    } else {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('appShell').classList.remove('visible');
        btn.innerHTML = GOOGLE_BTN_HTML;
        btn.disabled = false;
    }
});

window.handleGoogleLogin = async function () {
    const provider = new GoogleAuthProvider();
    const btn = document.getElementById('googleLoginBtn');
    const errDiv = document.getElementById('loginError');

    btn.innerHTML = 'Verifying...';
    btn.disabled = true;
    errDiv.style.display = 'none';

    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        errDiv.textContent = 'Authentication failed: ' + error.message;
        errDiv.style.display = 'block';
        btn.innerHTML = GOOGLE_BTN_HTML;
        btn.disabled = false;
    }
};

window.logout = async function () {
    try { await signOut(auth); } catch (e) { console.error(e); }
};
</script>

</body>
</html>
